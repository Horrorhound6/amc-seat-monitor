name: AMC Seat Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-seats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser tools
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Check AMC seats
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          cat > check.js <<'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();

            await page.goto(
              "https://www.amctheatres.com/showtimes/144316406/seats",
              {waitUntil:"networkidle", timeout:60000}
            );

            await page.waitForTimeout(10000);

            const text = await page.locator("body").innerText();

            const available =
              !text.includes("Sold Out") &&
              !text.includes("No seats available");

            if (available) {
              await fetch(process.env.DISCORD_WEBHOOK, {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body: JSON.stringify({
                  content:
                  "🎟️ Possible AMC seats available! Check now:\nhttps://www.amctheatres.com/showtimes/144316406/seats"
                })
              });
            }

            await browser.close();
          })();
          EOF

          node check.js
